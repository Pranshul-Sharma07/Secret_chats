<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Chats</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);padding:28px;background:#15181d;border:1px solid #292e37;border-radius:24px}.logo{font-size:30px;font-weight:800}.sub{color:#9ba3af;line-height:1.5;margin:8px 0 25px}label{font-size:12px;color:#aeb6c2;display:block;margin-bottom:8px}input{width:100%;background:#0d1014;color:#fff;border:1px solid #353b45;border-radius:14px;padding:15px;outline:0}button{cursor:pointer}.primary{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#7c5cff;color:white;font-weight:750}.made{text-align:center;color:#69717d;font-size:12px;margin-top:18px}
#chat,#admin{display:none;height:100vh;height:100dvh;width:100%;margin:0;flex-direction:column;background:#0b0d10}.head{height:68px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#12151a;border-bottom:1px solid #252a32}.title{font-weight:800}.status{font-size:12px;color:#8e97a5}.btn{background:#1d222a;border:1px solid #303640;color:#fff;padding:8px 11px;border-radius:10px}.msgs{flex:1;overflow:auto;padding:16px 13px;display:flex;flex-direction:column;gap:8px}.msg{max-width:76%;padding:9px 11px;border-radius:17px;background:#1a1f27;align-self:flex-start;overflow:hidden}.msg.me{align-self:flex-end;background:#6f52e8}.msg img,.msg video{display:block;max-width:100%;max-height:400px;border-radius:11px}.time{font-size:10px;opacity:.58;text-align:right;margin-top:4px}.composer{display:flex;gap:8px;padding:10px 12px;background:#12151a;border-top:1px solid #252a32}.composer input{padding:12px}.ico,.send{width:45px;border-radius:13px}.ico{border:1px solid #303640;background:#1d222a;color:#fff}.send{border:0;background:#7c5cff;color:#fff}
.adminrow{padding:12px;border-bottom:1px solid #252a32}.adminmsg{white-space:pre-wrap;word-break:break-word}.meta{font-size:11px;color:#89919e;margin-bottom:5px}
</style></head><body>
<section id="join" class="screen"><div class="card"><div class="logo">🔐 Secret Chats</div><div class="sub">Enter the same code on both devices. No account required.</div><label>CODE</label><input id="code" maxlength="80" placeholder="Enter code"><button class="primary" id="joinBtn">Enter Secret Chat</button><div class="made">Made by Pranshul Sharma</div></div></section>
<section id="chat"><header class="head"><div><div class="title">🔐 Secret Chats</div><div id="status" class="status">Connecting…</div></div><button class="btn" onclick="location.reload()">Leave</button></header><div id="msgs" class="msgs"></div><form id="composer" class="composer"><button type="button" class="ico" id="photoBtn">📷</button><button type="button" class="ico" id="videoBtn">🎥</button><input id="text" placeholder="Type a message…"><button class="send">➤</button><input id="photo" type="file" accept="image/*" hidden><input id="video" type="file" accept="video/*" hidden></form></section>
<section id="admin" class="screen"><div class="card"><div class="logo">🛡️ Chat Archive</div><div class="sub">Admin-only archive of stored messages.</div><input id="apass" type="password" placeholder="Admin password"><button class="primary" id="alogin">Open Archive</button><div id="archive"></div></div></section>
<script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io();let code="",name="Guest";
function roomHash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function render(m){const e=document.createElement("div");e.className="msg"+(m.senderId===senderId?" me":"");if(m.type==="text")e.textContent=m.text;else{const x=document.createElement(m.type==="image"?"img":"video");x.src=m.data_url;if(m.type==="video")x.controls=true;e.append(x)}const t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});e.append(t);$("msgs").append(e);$("msgs").scrollTop=$("msgs").scrollHeight}
$("joinBtn").onclick=()=>{code=$("code").value.trim().toUpperCase();if(code.length<4)return alert("Code must be at least 4 characters.");$("join").style.display="none";$("chat").style.display="flex";socket.emit("join-room",{room:roomHash(code),sender:name,senderId})};
socket.on("history",a=>{ $("msgs").innerHTML="";a.forEach(render)});socket.on("message",render);socket.on("presence",x=>$("status").textContent=`${x.online} online`);socket.on("join-error",x=>alert(x));
$("composer").onsubmit=e=>{e.preventDefault();let t=$("text").value.trim();if(t){socket.emit("message",{type:"text",text:t});$("text").value=""}};
async function fileSend(input,type){const f=input.files[0];input.value="";if(!f)return;if(f.size>20*1024*1024)return alert("Maximum 20 MB.");const r=new FileReader();r.onload=()=>socket.emit("message",{type,data_url:r.result});r.readAsDataURL(f)}
$("photoBtn").onclick=()=>{$("photo").click()};$("videoBtn").onclick=()=>{$("video").click()};$("photo").onchange=()=>fileSend($("photo"),"image");$("video").onchange=()=>fileSend($("video"),"video");

// Optional admin URL: /admin
if(location.pathname==="/admin"){ $("join").style.display="none";$("chat").style.display="none";$("admin").style.display="grid"}
$("alogin").onclick=async()=>{const r=await fetch("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("apass").value})});if(!r.ok)return alert("Wrong password");const x=await fetch("/admin/messages");const a=await x.json();$("archive").innerHTML="";a.forEach(m=>{const d=document.createElement("div");d.className="adminrow";d.innerHTML=`<div class="meta">Room: ${m.room} • ${m.sender} • ${new Date(m.created_at).toLocaleString()}</div><div class="adminmsg"></div>`;d.querySelector(".adminmsg").textContent=m.type==="text"?m.text:"["+m.type+" attachment stored]";$("archive").append(d)})};
</script></body></html>
